<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shellm live</title>
<style>
  :root {
    --bg: #0a0c11; --panel: rgba(16, 20, 28, 0.88); --line: #232a38; --ink: #dfe6f2; --dim: #8290a8;
    --accent: #7fd4ff; --warm: #ffae57; --edit: #ff5fb8; --ok: #7ee2a8;
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lab { position: absolute; left: 0; top: 0; white-space: pre; font-size: 11px; color: var(--dim); will-change: transform;
         text-shadow: 0 0 4px #000, 0 0 2px #000; }
  .lab.tok { color: var(--ink); background: rgba(10, 12, 17, .72); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .lab.tok.cur { border-color: var(--accent); color: var(--accent); }
  .lab.lens b { color: var(--ink); font-weight: 600; }
  .lab.lens.hit b { color: var(--ok); }
  .lab.head { text-transform: uppercase; letter-spacing: .12em; font-size: 10px; }
  .lab.next { font-size: 13px; color: #0a0c11; background: var(--accent); border-radius: 3px; padding: 1px 6px; font-weight: 700; }
  .lab.mod { color: var(--edit); }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(6px); }
  #left { left: 12px; top: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto; padding: 12px; }
  #right { right: 12px; top: 12px; width: 250px; max-height: calc(100% - 190px); overflow: auto; padding: 12px; }
  #strip { left: 324px; right: 12px; bottom: 12px; height: 150px; padding: 8px 12px; display: flex; flex-direction: column; }
  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .04em; }
  h2 { font-size: 10px; margin: 14px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .14em; font-weight: 600; }
  .sub { color: var(--dim); font-size: 11px; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; background: #0d1118; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: inherit; }
  textarea { resize: vertical; min-height: 54px; }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 0; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .row > label { color: var(--dim); font-size: 11px; flex: 0 0 auto; }
  .row > * { flex: 1 1 0; min-width: 0; }
  button { background: #182233; color: var(--ink); border: 1px solid #2c3a52; border-radius: 5px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06121c; border-color: var(--accent); font-weight: 700; }
  button.warn { border-color: #5a2a45; color: var(--edit); }
  button:disabled { opacity: .45; cursor: default; }
  input[type=range] { accent-color: var(--accent); padding: 0; }
  .val { flex: 0 0 38px !important; text-align: right; color: var(--dim); font-size: 11px; }
  .note { margin-top: 6px; font-size: 11px; color: var(--dim); min-height: 15px; }
  .note.good { color: var(--ok); } .note.bad { color: var(--edit); }

  .bar { display: grid; grid-template-columns: 92px 1fr 38px; gap: 6px; align-items: center; height: 18px; font-size: 12px; }
  .bar .t { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .bar .b { height: 8px; background: #141a25; border-radius: 2px; overflow: hidden; }
  .bar .b i { display: block; height: 100%; background: #3d5a80; }
  .bar .p { text-align: right; color: var(--dim); font-size: 11px; }
  .bar.pick .t { color: var(--accent); font-weight: 700; } .bar.pick .b i { background: var(--accent); }
  .lensrow { display: grid; grid-template-columns: 22px 1fr 38px; gap: 6px; font-size: 12px; height: 18px; align-items: center; }
  .lensrow .l { color: var(--dim); font-size: 11px; } .lensrow .t { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .lensrow .p { text-align: right; color: var(--dim); font-size: 11px; } .lensrow.hit .t { color: var(--ok); }
  #heads { display: flex; flex-wrap: wrap; gap: 5px; }
  #heads button { width: 24px; height: 20px; padding: 0; border-radius: 4px; font-size: 10px; color: #06121c; border: 0; font-weight: 700; }
  #heads button.off { opacity: .22; }
  #stats { font-size: 11px; color: var(--dim); margin-top: 8px; }

  #striphead { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 11px; margin-bottom: 4px; gap: 10px; }
  #striphead .grow { flex: 1; }
  #text { flex: 1; overflow: auto; font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  #text span { border-radius: 2px; cursor: pointer; }
  #text span.p { color: #9aa7bd; }
  #text span.pending { opacity: .3; }
  #text span.cur { outline: 1px solid var(--accent); }
  #text span.nxt { background: var(--accent) !important; color: #06121c; }
  #text span:hover { outline: 1px dashed var(--dim); }
  #conn { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #55607a; margin-right: 6px; vertical-align: middle; }
  #conn.on { background: var(--ok); }
  @media (max-width: 980px) { #right { display: none; } #left { width: 260px; } #strip { left: 284px; } }
</style>
<script type="importmap">{ "imports": { "three": "/static/vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div id="left" class="panel">
  <h1><span id="conn"></span>shellm live</h1>
  <div class="sub" id="modelline">connecting…</div>

  <h2>prompt</h2>
  <textarea id="prompt" spellcheck="false">It was a cold morning when Holmes</textarea>
  <div class="row"><label for="maxtok">tokens</label><input id="maxtok" type="number" min="1" max="1000" value="60">
    <label for="temp">temp</label><input id="temp" type="number" min="0" max="2" step="0.1" value="0.8"></div>
  <div class="row"><button id="go" class="primary">generate</button><button id="stop" disabled>stop</button></div>
  <div class="row"><label for="rate">playback</label><input id="rate" type="range" min="1" max="31" value="6"><span class="val" id="ratev">6/s</span></div>

  <h2>steer (runtime)</h2>
  <textarea id="spos" spellcheck="false" title="one example per line">The ship rolled as the waves broke over the bow.
Far out at sea the storm gathered and the sails were reefed.</textarea>
  <textarea id="sneg" spellcheck="false" title="one example per line" style="margin-top:6px">She poured the tea and sat by the fire in the parlour.
The drawing room was warm and the ladies talked quietly.</textarea>
  <div class="row"><label for="alpha">strength</label><input id="alpha" type="range" min="0" max="2" step="0.1" value="1"><span class="val" id="alphav">1.0</span></div>
  <div class="row"><button id="steer">steer toward first, away from second</button></div>
  <div class="row"><button id="unsteer">clear steering</button></div>
  <div class="note" id="steernote"></div>

  <h2>write a fact (rome)</h2>
  <input id="fprompt" type="text" spellcheck="false" value="The name of the lighthouse keeper's dog was">
  <div class="row"><input id="ftarget" type="text" spellcheck="false" value=" Biscuit"><button id="edit" style="flex:0 0 96px">write it</button></div>
  <div class="note" id="editnote"></div>

  <div class="row" style="margin-top:12px"><button id="reset" class="warn">reset model</button></div>
  <div class="note">everything here is also an http call. try <span style="color:var(--ink)">POST /v1/completions</span> from a script and watch it run.</div>
</div>

<div id="right" class="panel">
  <h2 style="margin-top:0">next token</h2>
  <div id="top"></div>
  <h2>each layer's guess</h2>
  <div id="lens"></div>
  <h2>attention heads</h2>
  <div id="heads"></div>
  <div id="stats"></div>
</div>

<div id="strip" class="panel">
  <div id="striphead"><span id="stepline">no generation yet</span><span class="grow"></span>
    <span>brighter = read more by the current token</span><button id="live" disabled>▶ follow live</button></div>
  <div id="text"></div>
</div>

<script type="module" src="/static/viewer.js"></script>
</body>
</html>
